[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "panthera-lab"
version = "0.2.0"
description = "Extensible MuJoCo experiments for a three-omniwheel Panthera arm"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mujoco==3.17.0",
  "numpy==2.2.6",
  "torch==2.11.0",
  "opencv-python-headless==4.13.0.92",
  "glfw==2.11.0",
  "PyOpenGL==3.1.10",
]

[project.optional-dependencies]
assets = ["trimesh==5.2.1", "pillow==12.3.0"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
panthera = "panthera_lab.cli:main"

[project.urls]
Repository = "https://github.com/wEch1ng/Panthera-HT_3Omnia-Chassis"

[tool.hatch.build.targets.wheel]
packages = ["src/panthera_lab"]

[tool.hatch.build.targets.wheel.force-include]
"assets/robots/panthera" = "panthera_lab/_resources/assets/robots/panthera"
"assets/tools" = "panthera_lab/_resources/assets/tools"
"checkpoints" = "panthera_lab/_resources/checkpoints"
"configs" = "panthera_lab/_resources/configs"
"licenses" = "panthera_lab/_resources/licenses"

[tool.hatch.build.targets.sdist]
include = ["/src", "/assets/robots", "/assets/tools", "/checkpoints", "/configs", "/licenses", "/docs", "/examples", "/scripts", "/tests", "/pyproject.toml", "/uv.lock", "/README.md", "/THIRD_PARTY_NOTICES.md"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  {index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'"},
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
